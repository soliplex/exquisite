[project]
name = "exquisite"
version = "0.1.0"
description = "Corpus management for RAG databases: manifests, worksheets, and evaluation labels"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tres Seaver", email = "tseaver@palladion.com" }
]
requires-python = ">=3.13"
keywords = [
    "rag",
    "retrieval-augmented generation",
    "evaluation",
    "corpus",
    "manifest",
    "citation",
    "soliplex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # Until paths render portably (#12), Windows is not tested.
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/soliplex/exquisite"
Documentation = "https://soliplex.github.io/exquisite/"
Repository = "https://github.com/soliplex/exquisite"
Issues = "https://github.com/soliplex/exquisite/issues"

[project.scripts]
exquisite = "exquisite.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage >= 7.13.5, < 7.14",
    "pytest >= 9.0.2, < 9.1",
    "pytest-cov >= 7.0.0, < 7.1",
    "ruff >= 0.16.6, < 0.17",
]
docs = [
    "zensical>=0.0.43",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests/unit"]
python_files = "test_*.py"
# skip 'tests/functional' by default
testpaths = ["tests/unit"]
# 'src/soliplex' (a path), not 'soliplex' (the importable name):
# 'soliplex' is a namespace package, and coverage cannot enumerate one
# by walking the filesystem, so a package-name target silently measures
# only the modules some test happened to import.  A path target reports
# never-imported modules at 0%, which is what makes 'omit' below the
# single place that decides what is exempt.
addopts = "--cov=src/exquisite --cov=tests/unit --cov-branch --cov-fail-under=100"
filterwarnings = [
    # "ignore::DeprecationWarning:<source-package>",
]

[tool.coverage.run]
omit = [
    # add as needed
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 79
exclude = [
    "*.md",  # ruff 0.16 formats Python in Markdown fences
]
force-exclude = true
target-version = "py313"

[tool.ruff.lint]
select = [
    # flake8
    "F",
    # pycodestyle
    "E",
    # flake8-bugbear
    "B",
    # pyupgrade
    "U",
    # isort
    "I",
    # pandas vet
    "PD",
    # tryceratops
    "TRY",
    # flake8-pytest-style
    "PT",
    # pylint:  imports belong at a module's top level
    "PLC0415",
    # flake8-import-conventions:  import modules, not their attributes
    # (see `banned-from` below)
    "ICN003",
]
ignore = [
    "PT019",  # incorrecly flags '@mock.patch' args as fixtures
]

[tool.ruff.lint.isort]
force-single-line = true
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-import-conventions]
# `ICN003` refuses `from <module> import <attribute>` only for the modules
# listed here:  import the module itself instead.  Ruff has no rule covering
# every module, so add each new package module, and each newly used library,
# as it appears.  `exquisite` itself is deliberately absent:  banning it would
# also refuse `from exquisite import rules`, which imports a module.
banned-from = [
    # the standard library, as used here
    "argparse",
    "collections",
    "csv",
    "dataclasses",
    "datetime",
    "functools",
    "hashlib",
    "json",
    "os",
    "pathlib",
    "re",
    "sys",
    "urllib.parse",
    # third-party
    "pytest",
    "yaml",
    # this package
    "exquisite.bind",
    "exquisite.cli",
    "exquisite.corpus",
    "exquisite.designators",
    "exquisite.manifest",
    "exquisite.resolve",
    "exquisite.rules",
    "exquisite.worksheets",
    # test helpers
    "_builders",
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.pymarkdown]
extensions.front-matter.enabled = true
plugins.line-length.enabled = false             # md013
plugins.no-duplicate-heading.enabled = false    # md024
plugins.no-inline-html.enabled = false          # md033
plugins.no-emphasis-as-heading.enabled = false  # md036
plugins.first-line-heading.enabled = false      # md041
plugins.code-block-style.enabled = false        # md046
# There is no rule 'md060'
# plugins.md060.enabled = false                 # md060
