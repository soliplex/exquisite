name: sp800-2020
cases:
- name: risk-assessment-steps
  inputs: What are the steps of a risk assessment?
  metadata:
    uuid: d424c6ef-bd16-5c51-98a3-044778cffe0f
    question_number: '1'
    type: qa
    reference: NIST SP 800-30 Rev. 1, Chapter 3
  expected_output: >-
    Prepare for the assessment; conduct the assessment; communicate
    the results; maintain the assessment.
- name: risk-management-tiers
  inputs: At which tiers does an organization manage information security risk?
  metadata:
    uuid: 9727865e-b3a5-5474-9021-e234c1c8e27e
    question_number: '2'
    type: qa
    reference: NIST SP 800-39, Section 2.2
  expected_output: >-
    Tier 1, the organization; Tier 2, the mission/business process;
    Tier 3, the information system.
- name: risk-model-factors
  inputs: Which risk factors does a risk model typically include?
  metadata:
    uuid: 521135f4-6d00-5f61-8ada-5dc74110c8d8
    question_number: '3'
    type: qa
    reference: NIST Special Publication 800-30 Revision 1, Section 2.3.1
  expected_output: >-
    Threat, vulnerability, impact, likelihood, and predisposing condition.
- name: incident-response-phases
  inputs: What are the phases of the incident response life cycle?
  metadata:
    uuid: 1d2c2d01-cef7-501f-9c34-f8f9c985dd65
    question_number: '4'
    type: qa
    reference: NIST SP 800-61 Rev. 2, Section 3
  expected_output: >-
    Preparation; Detection and Analysis; Containment, Eradication,
    and Recovery; and Post-Incident Activity.
- name: lessons-learned-meeting-timing
  inputs: >-
    When should we hold the lessons-learned meeting after a major incident?
  metadata:
    uuid: e259d7e6-2a6d-50ed-ac26-ab57644307c8
    question_number: '5'
    type: qa
    reference: NIST SP 800-61r2 Section 3.4.1
  expected_output: >-
    Within several days of the end of the incident.
- name: incident-records-retention
  inputs: How long should incident handling records be kept?
  metadata:
    uuid: 065bd665-ebd2-5f94-93ba-0adef0102575
    question_number: '6'
    type: qa
    reference: NIST SP 800-61 Rev. 2, Section 3.4.3
  expected_output: >-
    Three years, under General Records Schedule (GRS) 24.
- name: control-family-count
  inputs: Into how many families are the security controls organized?
  metadata:
    uuid: 8764791a-1e15-5448-9d57-103d9ebdedcf
    question_number: '7'
    type: qa
    reference: NIST SP 800-53 Rev. 4, Section 2.2
  expected_output: >-
    Eighteen.
- name: control-baselines
  inputs: Which security control baselines does the catalog define?
  metadata:
    uuid: b8bca4b6-ae67-5a46-b173-037b2ea53215
    question_number: '8'
    type: qa
    reference: NIST SP 800-53 Rev. 4, Section 2.3
  expected_output: >-
    There are baselines for low-impact, moderate-impact, and high-impact
    information systems.
- name: account-management-control
  inputs: Which control covers account management?
  metadata:
    uuid: c74018f9-879b-5061-a45b-3bb88bcb4961
    question_number: '9'
    type: qa
    reference: NIST SP 800-53 Rev. 4, Control AC-2
  expected_output: AC-2, Account Management.
- name: incident-response-plan-control
  inputs: >-
    Which control requires an incident response plan, and in which baselines
    is it selected?
  metadata:
    uuid: 4f696d9f-f43e-5c0e-a5cc-c76e2ee341ae
    question_number: '10'
    type: qa
    reference: NIST SP 800-53 Rev. 4, Control IR-8
  expected_output: >-
    IR-8, Incident Response Plan; it is in the low, moderate, and high
    baselines.
- name: password-minimum-length
  inputs: What is the minimum length of a password the subscriber chooses?
  metadata:
    uuid: aecca376-43a6-5864-897e-9b9176fd17be
    question_number: '13'
    type: qa
    reference: NIST SP 800-63B, Section 5.1.1.1
  expected_output: At least 8 characters.
- name: password-periodic-change
  inputs: Should we make users change their passwords periodically?
  metadata:
    uuid: b5330ee5-f3b3-597a-8ba7-fa82991b4136
    question_number: '14'
    type: qa
    reference: NIST SP 800-63B, Section 5.1.1.2
  expected_output: >-
    Verifiers should not require memorized secrets to be changed
    arbitrarily (for example, periodically).
- name: sms-out-of-band-authentication
  inputs: Can we still use SMS for out-of-band authentication?
  metadata:
    uuid: 2babe671-9752-571e-bff6-8dcb03fc4717
    question_number: '15'
    type: qa
    reference: NIST SP 800-63B, Section 5.1.3.3
  expected_output: >-
    Yes, but use of the PSTN (SMS or voice) for out-of-band verification
    is RESTRICTED.
- name: aal2-reauthentication-interval
  inputs: At AAL2, how often must a subscriber reauthenticate?
  metadata:
    uuid: 49cc4653-55ff-506c-b17e-5408987bb8a0
    question_number: '16'
    type: qa
    reference: NIST SP 800-63B, Section 4.2.3
  expected_output: >-
    At least once per 12 hours during an extended session, and after
    any period of inactivity lasting 30 minutes or longer.
- name: impact-levels
  inputs: >-
    What levels of potential impact are used to categorize information and
    systems?
  metadata:
    uuid: 33e57977-c22b-5df6-a221-8e91012fb3d5
    question_number: '17'
    type: qa
    reference: FIPS 199, Section 3
  expected_output: >-
    The impact levels are 'low', 'moderate', and 'high'.
- name: budget-formulation-categorization
  inputs: >-
    What is the recommended security categorization of budget formulation
    information?
  metadata:
    uuid: 01c66344-8bea-5175-b997-70d3220624de
    question_number: '18'
    type: qa
    reference: NIST SP 800-60 Volume II Revision 1, Appendix C
  expected_output: Low for confidentiality, integrity, and availability.
- name: fisma-security-objectives
  inputs: >-
    What are the three security objectives identified under FISMA for
    information and information systems?
  metadata:
    uuid: b7064fd0-d9b5-5f88-93cd-88ac653b40f2
    question_number: '21'
    type: qa
    reference: FIPS 199, Section 3
  expected_output: Confidentiality, integrity, and availability.
- name: aggregate-security-categorization
  inputs: >-
    How are security categorizations aggregated from components of an
    information system?
  metadata:
    uuid: cbc2e955-5f0f-598d-95c3-0fd3f01a461e
    question_number: '22'
    type: qa
    reference: FIPS 199, Section 3
  expected_output: >-
    The aggregate value for each security objective is the highest
    value assigned for that objective in any component's categorization.
- name: adequate-security
  inputs: What does it mean for an information system to have adequate security?
  metadata:
    uuid: fcb4afd2-9561-4b33-8e55-0021e0209c38
    question_number: '23'
    type: qa
    reference: fips 200, appendix a
  expected_output: >-
    its security is commensurate with the risk and magnitude of harm
    resulting from the loss, misuse, or unauthorized access to or modification
    of information.
- name: risk-management-framework-steps
  inputs: >-
    What are the seven steps which make up the Risk Management Framework (RMF)?
  metadata:
    uuid: 1a6af75b-9990-4cef-924b-e357ccb42ecb
    question_number: '24'
    type: qa
    reference: SP 800-37, Chapter 3
  expected_output: >-
    Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor
- name: risk-management-framework-monitor-step
  inputs: >-
    What is the purpose of the Monitor step in the Risk Management Framework
    (RMF)?
  metadata:
    uuid: dd820b3b-cc9d-42ea-97c1-a5dd45b3dc32
    question_number: '25'
    type: qa
    reference: SP 800-37, Section 3.7
  expected_output: >-
    The purpose of the Monitor step is to maintain an ongoing situational
    awareness about the security and privacy posture of the information system
    and the organization in support of risk management decisions.
- name: assessment-objectives-methods-objects
  inputs: >-
    What are the components of an assessment procedure for security and privacy
    controls?
  metadata:
    uuid: c3be4ac7-4449-4051-9c45-43fc2f83a5ab
    question_number: '26'
    type: qa
    reference: SP 800-53A rev. 4, Section 2.4
  expected_output: >-
    An assessment procedure consists of a set of assessment objectives,
    each with an associated set of potential assessment methods and assessment
    objects.
- name: considerations-automating-iscm
  inputs: >-
    What should an organization consider when determining the extent of
    automation of an information security continuous monitoring (ISCM) program?
  metadata:
    uuid: b5157f81-8c02-4f81-a565-cb4cacefe663
    question_number: '27'
    type: qa
    reference: SP 800-137, Section 2.3
  expected_output: >-
    When determining the extent to which the organization automates
    ISCM, organizations consider potential efficiencies of process
    standardization that may be gained with automation, and the potential
    value (or lack of value) of the automated security-related information
    from a risk management perspective.  Additionally, organizations consider
    intangibles such as the potential value of personnel reassignment and
    more comprehensive situational awareness.
- name: scoring-iscm-assessments
  inputs: >-
    How are individual ISCM assessment judgements aggregated to create an
    overall assessment score?
  metadata:
    uuid: 8ccb74cd-b536-408d-b56e-289e635c8310
    question_number: '28'
    type: qa
    reference: SP 800-137A, Section 2.2.10
  expected_output: >-
    Using default binary judgement values, each assessment is assigned
    a value of '1' ('Satisfied') or '0' ('Other than satisfied').
    Individual elements can be multiplied by a weighting factor.
    The overall result can be expressed as a percentage by dividing the sum
    of the scores by the best possible score.
- name: business-areas-identifying-information-types
  inputs: >-
    What four business areas are used to identify information types when
    mapping information and information systems to security categories?
  metadata:
    uuid: f29ba1f6-26f0-403e-85c2-232063af29e4
    question_number: '29'
    type: qa
    reference: SP 800-60 Vol. 1 Rev. 1, Section 4.1
  expected_output: >-
    The purpose of government (services for citizens); the mechanisms
    the government uses to achieve its purpose (mode of delivery);
    the support functions needed to conduct government operations (support
    delivery of services); the resource management functions that support all
    areas of the government's business (management of government resources)
- name: authentication-process-strength-levels
  inputs: >-
    What labels and their corresponding requirements are used to describe
    the strength of an authentication process?
  metadata:
    uuid: 971d3229-f3f1-48aa-b160-ace5371b3eb8
    question_number: '30'
    type: qa
    reference: SP 800-63-3, Ch. 4
  expected_output: >-
    AAL1 requires single-factor authentication; AAL2 requires two
    authentication factors; AAL3 requires the use of a hardware-based
    authenticator and verifier impersonation resistance
- name: role-of-biometrics-in-identity-assurance-level-3
  inputs: >-
    How are biometrics used to protect the identity and relying party (RP) at
    Identity Assurance Level 3?
  metadata:
    uuid: 1e4e5c12-e825-422f-985e-fa4986afb1fb
    question_number: '31'
    type: qa
    reference: SP 800-63A, Section 4.5
  expected_output: >-
    To detect fraudulent and duplicate enrollments, and as a mechanism to
    re-establish binding to a credential. The CSP collects and records a
    biometric sample at the time of proofing (for example, a facial image or
    fingerprints) for non-repudiation and re-proofing.
- name: disaster-recovery-plan-vs-info-system-contingency-plan
  inputs: >-
    How does an information system contingency plan (ISCP) differ from a
    disaster recovery plan (DRP)?
  metadata:
    uuid: 856874b5-6cad-4818-9c85-6cde79839d5f
    question_number: '32'
    type: qa
    reference: SP 800-34 Rev. 1, Section 2.2.7
  expected_output: >-
    The ISCP differs from a DRP primarily in that the information system
    contingency plan procedures are developed for recovery of the system
    regardless of site or location. An ISCP can be activated at the system’s
    current location or at an alternate site. In contrast, a DRP is primarily a
    site-specific plan developed with procedures to move operations of one or
    more information systems from a damaged or uninhabitable location to a
    temporary alternate location. Once the DRP has successfully transferred an
    information system site to an alternate site, each affected system would
    then use its respective ISCP to restore, recover, and test systems, and put
    them into operation.
- name: use-of-scap-within-security-focused-config-mgmt
  inputs: >-
    How is Security Content Automation Protocol (SCAP) tooling used in the
    context of a security-focused configuration management program?
  metadata:
    uuid: c20afd18-8154-4135-a5dc-b7a9e4c3bb83
    question_number: '33'
    type: qa
    reference: SP 800-128, Section 3.5, Using SCAP
  expected_output: >-
    SCAP-enabled tools can be used for maintaining the security of enterprise
    systems, such as automatically verifying the installation of patches,
    checking system security configuration settings against an expected
    baseline, and examining systems for signs of compromise.
- name: enterprise-patch-management-technologies
  inputs: >-
    What three patch management technologies are available for enterprise patch
    management requirements?
  metadata:
    uuid: e5cf8c67-db66-4a51-a38e-a1f479ccff3b
    question_number: '34'
    type: qa
    reference: SP 800-40 rev 3, Chapter 4
  expected_output: >-
    Agent-based patch management, agentless scanning, and passive network
    monitoring
- name: security-plan-review-cadence
  inputs: How often should an information systems security plan be reviewed?
  metadata:
    uuid: cabd69e6-39df-4d3d-9edf-ce31418a8e5f
    question_number: '35'
    type: qa
    reference: SP 800-18 Rev. 1, Section 3.16
  expected_output: >-
    At least annually, and updated if appropriate.
