# What this ingestion of the corpus is, and where it came from.
# Generated alongside sp800-2020.csv; the two are a pair.
#
# SYNTHETIC:  written by hand, not extracted from a RAG database.  The URIs
# are shaped like an ingester's; the source URLs are NIST's official ones.
#
# The documents were downloaded on 2026-10-02 and 2026-10-04.  NIST adds a
# one-page withdrawal notice to a publication's PDF when it withdraws it, and
# serves only that copy afterwards.  For the publications withdrawn since
# 2020-06-30, the notice page is stripped (the '.as-of-2020-06-30.pdf'
# files), so their hashes are of the stripped copies, not of the file at
# their source URL.
#
# This ingestion holds the editions current on its 'as_of' date, for an
# agency's security program run under the NIST Risk Management Framework.
database: sp800-2020
extracted_at: 2026-10-04T00:00:00+00:00

# The snapshot's date:  every document here was current on it.
as_of: 2020-06-30

# Row count in the CSV must match; a mismatch means a truncated extraction.
documents: 19
