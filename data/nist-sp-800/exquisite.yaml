# Normalization rules for the NIST SP 800 example corpus.  Caller rules run
# before the built-ins:  rewrites before the built-in volume / supplement
# folding, relations before the built-in supplement / volume / sub-publication.

designators:
  rewrite:
    # "NIST Special Publication 800-53" / "NIST SP 800-53" -> "SP 800-53"
    - {pattern: '^\s*nist\s+(?:special\s+publication|sp)\b', replace: 'sp'}
    # SP 800-60 numbers its volumes in Roman numerals:  "Volume II" -> "vol 2".
    # Before the built-in folding, which would read "Volume I" as "vi".
    - {pattern: '\bvol(?:ume)?\.?\s*ii\b', replace: 'vol 2'}
    - {pattern: '\bvol(?:ume)?\.?\s*i\b', replace: 'vol 1'}
    # "Rev. 5", "Revision 5" -> "r5"
    - {pattern: '\brev(?:ision)?\.?\s*(\d+)', replace: 'r\1'}
  series:
    # Filenames lead with "NIST.SP." or the legacy "nistspecialpublication".
    sp: [nist, nistspecialpublication]
  location_words: [appendix, control]

relations:
  # Checked on what an identifier adds beyond a cited key:  a citation of
  # "SP 800-30" with no revision lists Rev. 1 as a revision of it.
  - {pattern: '^r\d+$', label: revision}
