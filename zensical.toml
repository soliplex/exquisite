# Local preview of this project's docs:  `uv run --group docs zensical serve`.
# The published site is built by soliplex/soliplex.github.io, which copies
# `docs/` into its own tree and generates the navigation from it.
[project]
site_name = "exquisite"
site_url = "https://soliplex.github.io/exquisite/"
dev_addr = "127.0.0.1:8002"
repo_name = "soliplex/exquisite"
repo_url = "https://github.com/soliplex/exquisite"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "The Data Repository" = "data-repository.md" },
  { "Question Sets" = "question-sets.md" },
  { "Ingestion Manifests" = "manifests.md" },
  { "Worksheets" = "worksheets.md" },
  { "Binding" = "binding.md" },
  { "Checking Retrieval" = "check-retrieval.md" },
  { "Normalization Rules" = "rules.md" },
  { "Development" = "development.md" },
]

# --------------------------------------------------------------------------
# Theme (as in soliplex/soliplex, without its logo)
# --------------------------------------------------------------------------
[project.theme]
language = "en"

features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github-alt"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/lightbulb-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "amber"
toggle.icon = "material/lightbulb"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "amber"
toggle.icon = "material/lightbulb-outline"
toggle.name = "Switch to system preference"

# --------------------------------------------------------------------------
# Markdown extensions
# --------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
use_pygments = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
